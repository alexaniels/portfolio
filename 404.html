<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found – Alexandra Nielsen</title>
  <link rel="icon" href="/assets/icons/favicon.png">
  <!-- "/" at the start of the paths, because this page can be shown on any address -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <main class="not-found">
    <div class="window">
      <div class="window__titlebar">
        <h1 class="window__title">Error 404</h1>
      </div>
      <div class="window__body">
        <p>Windows cannot find this page. It may have been moved, or the address may be misspelled.</p>
        <p class="not-found__buttons">
          <a href="/index.html">Go to desktop</a>
          <a href="/work.html">See my work</a>
        </p>
      </div>
    </div>
  </main>
</body>
</html>
