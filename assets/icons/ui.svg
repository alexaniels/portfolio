<svg xmlns="http://www.w3.org/2000/svg">
  <!-- UI icon sprite. Used as <svg><use href="assets/icons/ui.svg#name"/></svg>.
       Drawn on a 16x16 pixel grid to match the Windows 98 look. -->
  <symbol id="minimize" viewBox="0 0 16 16"><rect x="3" y="11" width="8" height="2" fill="currentColor"/></symbol>
  <symbol id="maximize" viewBox="0 0 16 16"><path d="M2 2h12v12H2zM4 6v6h8V6z" fill="currentColor" fill-rule="evenodd"/></symbol>
  <symbol id="close" viewBox="0 0 16 16"><path d="M3 3h2l3 3 3-3h2v2l-3 3 3 3v2h-2l-3-3-3 3H3v-2l3-3-3-3z" fill="currentColor"/></symbol>
  <symbol id="back" viewBox="0 0 16 16"><path d="M1 8l6-6v4h8v4H7v4z" fill="currentColor"/></symbol>
  <symbol id="forward" viewBox="0 0 16 16"><path d="M15 8L9 2v4H1v4h8v4z" fill="currentColor"/></symbol>
  <symbol id="home" viewBox="0 0 16 16"><path d="M8 1l7 6h-2v8H9v-5H7v5H3V7H1z" fill="currentColor"/></symbol>
  <symbol id="globe" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="8" cy="8" r="6.5"/><ellipse cx="8" cy="8" rx="3" ry="6.5"/><path d="M1.5 8h13M2.5 4.8h11M2.5 11.2h11M8 1.5v13"/></g></symbol>
  <symbol id="star" viewBox="0 0 16 16"><path d="M8 .8l2.2 4.8 5.2.5-3.9 3.5 1.1 5.1L8 12.1l-4.6 2.6 1.1-5.1L.6 6.1l5.2-.5z" fill="currentColor"/></symbol>
  <symbol id="menu" viewBox="0 0 16 16"><path d="M2 3h12v2H2zm0 4h12v2H2zm0 4h12v2H2z" fill="currentColor"/></symbol>
  <symbol id="pause" viewBox="0 0 16 16"><path d="M4 3h3v10H4zm5 0h3v10H9z" fill="currentColor"/></symbol>
  <symbol id="play" viewBox="0 0 16 16"><path d="M5 3l8 5-8 5z" fill="currentColor"/></symbol>
  <symbol id="arrow-up" viewBox="0 0 16 16"><path d="M8 5l5 6H3z" fill="currentColor"/></symbol>
  <symbol id="arrow-down" viewBox="0 0 16 16"><path d="M8 11L3 5h10z" fill="currentColor"/></symbol>
  <symbol id="copy" viewBox="0 0 16 16"><path d="M5 1h8v10H5zM6.5 2.5v7h5v-7zM2 4h2v1.5H3.5v8h6V13H11v2H2z" fill="currentColor"/></symbol>
  <symbol id="info" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="#fff" stroke="#000080" stroke-width="2"/><path d="M14 13h4v11h-4zm0-6h4v4h-4z" fill="#000080"/></symbol>
  <symbol id="warning" viewBox="0 0 32 32"><path d="M16 2l15 27H1z" fill="#ffd200" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/><path d="M14.5 10h3l-.6 11h-1.8zM14.5 23h3v3h-3z" fill="#000"/></symbol>
</svg>
